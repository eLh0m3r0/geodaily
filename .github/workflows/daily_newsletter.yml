name: Daily Geopolitical Newsletter

on:
  schedule:
    # GitHub starts scheduled runs late under load — since 2026-09-17 the
    # 6:17 slot actually started 11:30-14:15 UTC, so the "morning" issue
    # landed in European inboxes in the afternoon. Slots are therefore early
    # and on off-peak minutes (top-of-hour slots are the ones GitHub drops,
    # which cost us the 2026-08-27/28 issues). All times UTC, so the issue
    # date (UTC) is always "today".
    - cron: '23 3 * * *'   # primary
    # Self-healing backups: the precheck job turns them into no-ops once
    # today's issue is on the default branch, so they can never double-send.
    - cron: '47 4 * * *'
    - cron: '11 6 * * *'
  # Reliable trigger for an external scheduler (cron-job.org, etc.) — GitHub
  # delivers repository_dispatch immediately, unlike cron. Same precheck
  # guard as the schedule, so firing it more than once a day is harmless.
  # Needs a fine-grained PAT with "Contents: read & write" on this repo:
  #   curl -fsS -X POST \
  #     -H "Accept: application/vnd.github+json" \
  #     -H "Authorization: Bearer $GITHUB_PAT" \
  #     -H "X-GitHub-Api-Version: 2022-11-28" \
  #     https://api.github.com/repos/OWNER/REPO/dispatches \
  #     -d '{"event_type":"publish-newsletter"}'
  # (see DEPLOYMENT.md, "Reliable daily trigger")
  repository_dispatch:
    types: [publish-newsletter]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no real API calls)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  # NOTE: no push trigger — a push-triggered run would generate and PUBLISH a
  # second newsletter the same day (double email to subscribers, double AI
  # spend). Code changes are validated by ci.yml (dry run, no publishing) and
  # go live with the next scheduled run.

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Allow multiple concurrent runs for debugging, but still prevent conflicts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Duplicate guard: scheduled and repository_dispatch runs become no-ops once
  # today's issue exists, so backup slots / repeated external pings can never
  # double-send. Manual (workflow_dispatch) runs always run.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Check whether today's issue already exists
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      run: |
        TODAY_FILE="docs/newsletters/newsletter-$(date -u +%F).html"
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Check the LATEST default branch, not this run's checkout: a slot
        # that queued behind a running publish (concurrency group) was
        # triggered at the pre-publish commit and would not see the new file.
        if git fetch --depth=1 origin "$DEFAULT_BRANCH" 2>/dev/null \
             && git cat-file -e "FETCH_HEAD:$TODAY_FILE" 2>/dev/null; then
          EXISTS=true
        elif [ -f "$TODAY_FILE" ]; then
          EXISTS=true
        else
          EXISTS=false
        fi
        if [ "$EXISTS" = "true" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "✅ $TODAY_FILE already published — this $EVENT_NAME run is a no-op."
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

  generate-newsletter:
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.publish == 'true'
    # The full pipeline (861 feeds' worth of collection, embeddings, two AI
    # calls with adaptive thinking, publish) legitimately takes ~13 minutes;
    # the old 15-minute cap killed the 2026-08-27 run. DeepSeek calls that
    # write ~15k tokens take up to ~9 min each, and one hung call may burn
    # the 10-minute request limit before its retry — hence 45.
    timeout-minutes: 45
    outputs:
      # Set once the Pages artifact is uploaded, so the site still deploys
      # when a LATER step (email delivery check) fails the job.
      pages_ready: ${{ steps.pages_ready.outputs.ready }}
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      # The pipeline dates the issue with the local clock; pin it to UTC.
      TZ: UTC
      EMAIL_DELIVERY_STATUS_FILE: output/email_delivery_status.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache embedding model
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/fastembed
          ~/.cache/huggingface
        key: fastembed-all-minilm-l6-v2-2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create necessary directories
      run: |
        mkdir -p logs output docs ai_archive

    - name: Set environment variables
      run: |
        # Required API keys from GitHub secrets
        echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
        echo "AI_PROVIDER=${{ vars.AI_PROVIDER || 'openrouter' }}" >> $GITHUB_ENV
        echo "AI_MODEL=${{ vars.AI_MODEL || 'deepseek/deepseek-v4.1-flash' }}" >> $GITHUB_ENV

        # Optional API keys
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
        fi

        # Newsletter configuration from secrets or defaults
        echo "NEWSLETTER_TITLE=${{ secrets.NEWSLETTER_TITLE || 'Geopolitical Daily' }}" >> $GITHUB_ENV
        echo "NEWSLETTER_AUTHOR=${{ secrets.NEWSLETTER_AUTHOR || 'Geopolitical Daily Team' }}" >> $GITHUB_ENV
        if [ -n "${{ secrets.NEWSLETTER_FROM_EMAIL }}" ]; then
          echo "NEWSLETTER_FROM_EMAIL=${{ secrets.NEWSLETTER_FROM_EMAIL }}" >> $GITHUB_ENV
        fi

        # Email notification settings
        if [ -n "${{ secrets.ADMIN_EMAIL }}" ]; then
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.SMTP_SERVER }}" ]; then
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.SMTP_PORT }}" ]; then
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.SMTP_USERNAME }}" ]; then
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.SMTP_FROM_EMAIL }}" ]; then
          echo "SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.BUTTONDOWN_USERNAME }}" ]; then
          echo "BUTTONDOWN_USERNAME=${{ secrets.BUTTONDOWN_USERNAME }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.BUTTONDOWN_API_KEY }}" ]; then
          echo "BUTTONDOWN_API_KEY=${{ secrets.BUTTONDOWN_API_KEY }}" >> $GITHUB_ENV
        fi

        # Beehiiv publishing (optional — skipped if secrets not set)
        if [ -n "${{ secrets.BEEHIIV_API_KEY }}" ]; then
          echo "BEEHIIV_API_KEY=${{ secrets.BEEHIIV_API_KEY }}" >> $GITHUB_ENV
        fi
        # Accept BEEHIIV_PUBLICATION_ID_V2 (v2 API) or the generic fallback
        if [ -n "${{ secrets.BEEHIIV_PUBLICATION_ID_V2 }}" ]; then
          echo "BEEHIIV_PUBLICATION_ID=${{ secrets.BEEHIIV_PUBLICATION_ID_V2 }}" >> $GITHUB_ENV
        elif [ -n "${{ secrets.BEEHIIV_PUBLICATION_ID }}" ]; then
          echo "BEEHIIV_PUBLICATION_ID=${{ secrets.BEEHIIV_PUBLICATION_ID }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ secrets.BEEHIIV_STATUS }}" ]; then
          echo "BEEHIIV_STATUS=${{ secrets.BEEHIIV_STATUS }}" >> $GITHUB_ENV
        fi

        # System configuration
        echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        # AI_PROVIDER / AI_MODEL are set above (vars or the DeepSeek default);
        # a hard-coded AI_MODEL here would silently override them — it did on
        # 2026-09-16, when the first "DeepSeek" issue actually ran on Sonnet.
        echo "AI_MAX_TOKENS=16000" >> $GITHUB_ENV
        echo "CLEANUP_ENABLED=false" >> $GITHUB_ENV
        echo "DEBUG=false" >> $GITHUB_ENV

        # AI Archiving configuration
        echo "AI_ARCHIVE_PATH=ai_archive" >> $GITHUB_ENV
        echo "AI_ARCHIVE_ENABLED=true" >> $GITHUB_ENV
        echo "AI_ARCHIVE_RETENTION_DAYS=30" >> $GITHUB_ENV
        echo "AI_ARCHIVE_MAX_SIZE_MB=500" >> $GITHUB_ENV
        
        # Dashboard configuration
        echo "DASHBOARD_OUTPUT_PATH=docs" >> $GITHUB_ENV
        echo "DASHBOARD_AUTO_GENERATE=true" >> $GITHUB_ENV
        
        # X.com Thread Generation configuration
        echo "X_THREADS_ENABLED=true" >> $GITHUB_ENV
        # Vlakna jsou CESKY a na DeepSeeku netestovana - zustavaji na puvodnim
        # modelu, aby se menila jen jedna promenna. Az se cestina overi, staci
        # tyhle dva radky smazat (prevezmou pak hlavni AI_PROVIDER/AI_MODEL).
        echo "X_THREADS_AI_PROVIDER=anthropic" >> $GITHUB_ENV
        echo "X_THREADS_MODEL=claude-sonnet-5" >> $GITHUB_ENV
        echo "X_THREADS_MAX_DAILY=4" >> $GITHUB_ENV
        echo "X_THREADS_MIN_IMPACT_SCORE=7.0" >> $GITHUB_ENV

        # Newsletter Archive configuration
        echo "NEWSLETTER_ARCHIVE_SIZE=10" >> $GITHUB_ENV

        # Set dry run mode based on input or default to false for scheduled runs
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          echo "DRY_RUN=true" >> $GITHUB_ENV
        else
          echo "DRY_RUN=false" >> $GITHUB_ENV
        fi

        # Allow overwriting existing newsletters for debugging (manual runs, dry-run mode, or debug mode)
        if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "$DEBUG" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "ALLOW_OVERWRITE=true" >> $GITHUB_ENV
        else
          echo "ALLOW_OVERWRITE=false" >> $GITHUB_ENV
        fi

    - name: Validate configuration
      run: |
        python -c "
        from src.config import Config
        missing = Config.validate_config()
        if missing and not Config.DRY_RUN:
            print(f'❌ Missing configuration: {missing}')
            exit(1)
        else:
            print('✅ Configuration validated successfully')
        "

    - name: Run newsletter pipeline
      run: |
        python -m src.main_pipeline

    - name: Generate unified dashboard
      if: success()
      run: |
        echo "📊 Generating unified dashboard..."
        
        # Generate simple dashboard (no complex imports)
        python generate_simple_dashboard.py || echo "Dashboard generation failed, continuing..."

    - name: Archive cleanup
      if: success() && github.event_name != 'workflow_dispatch'
      run: |
        echo "🧹 Running archive cleanup..."
        python cleanup_archives.py --days ${{ env.AI_ARCHIVE_RETENTION_DAYS }} --force --verbose

    # A DRY_RUN issue is mock content: never commit it (it would overwrite
    # today's real issue on main) and never deploy it to the live site.
    - name: Commit newsletter archive back to repository
      if: env.DRY_RUN != 'true'
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if there are changes in docs/
        if git diff --quiet docs/ && git diff --cached --quiet docs/; then
          echo "📝 No changes in docs/ to commit"
        else
          echo "📝 Committing newsletter archive changes..."
          git add docs/
          git commit -m "auto: Update newsletter archive - $(date -u '+%Y-%m-%d %H:%M UTC')
          
          - Updated newsletter archive with latest edition
          - Maintained rolling archive of last ${{ env.NEWSLETTER_ARCHIVE_SIZE || '10' }} newsletters
          - Auto-generated by GitHub Actions workflow"
          
          echo "📤 Pulling latest changes and pushing to repository..."
          git pull origin main --no-rebase --no-edit || {
            echo "⚠️ Merge conflict detected, using ours strategy"
            git checkout --ours docs/
            git add docs/
            git commit --no-edit
          }
          git push origin main
          echo "✅ Newsletter archive committed and pushed"
        fi

    - name: Upload pages artifact
      if: env.DRY_RUN != 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/

    - name: Mark Pages artifact ready
      if: env.DRY_RUN != 'true'
      id: pages_ready
      run: echo "ready=true" >> "$GITHUB_OUTPUT"

    # The pipeline exits 0 when only the email failed (the web issue is
    # already written), so check the delivery record explicitly. Runs after
    # the archive commit and Pages upload: the site still publishes, but the
    # job goes red and "Create issue on failure" fires.
    - name: Verify email delivery
      run: |
        STATUS_FILE="$EMAIL_DELIVERY_STATUS_FILE"
        if [ ! -f "$STATUS_FILE" ]; then
          echo "ℹ️ No email delivery record (email step not reached or not configured)."
          exit 0
        fi
        cat "$STATUS_FILE"
        STATUS=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$STATUS_FILE")
        if [ "$STATUS" = "failed" ]; then
          ERROR=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('error') or '')" "$STATUS_FILE")
          echo "::error title=Newsletter email NOT sent::$ERROR"
          echo "- **Email**: ❌ NOT sent — $ERROR" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "✅ Email delivery status: $STATUS"

    - name: Upload newsletter artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: newsletter-${{ github.run_number }}
        path: |
          output/*.html
          docs/**/*
          logs/*.log
          ai_archive/**/*
          docs/dashboard.html
        retention-days: 30

    - name: Create issue on failure
      if: failure() && github.event_name != 'workflow_dispatch'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let emailNote = '';
          try {
            const rec = JSON.parse(fs.readFileSync(process.env.EMAIL_DELIVERY_STATUS_FILE, 'utf8'));
            if (rec.status === 'failed') {
              emailNote = `\n**Email NOT sent to subscribers:** ${rec.error}\n(The web issue was published; resend from the Buttondown dashboard or fix and re-run manually.)\n`;
            }
          } catch (e) { /* no delivery record */ }
          const title = `Newsletter Pipeline Failed - ${new Date().toISOString().split('T')[0]}`;
          const body = `
          The daily newsletter pipeline failed during the ${{ github.event_name }} run.
          ${emailNote}

          **Run Details:**
          - Run ID: ${{ github.run_id }}
          - Run Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Time: ${new Date().toISOString()}

          **Next Steps:**
          1. Check the workflow logs for detailed error information
          2. Review the uploaded artifacts for any generated content
          3. Verify API keys and external service availability
          4. Consider running manually with dry-run mode for testing

          **Logs:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['bug', 'automation', 'newsletter']
          });

    - name: Summary
      if: always()
      run: |
        echo "## Newsletter Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dry Run**: ${{ env.DRY_RUN }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY

        # Check if newsletter was generated
        if [ -d "docs/newsletters" ] && [ "$(ls -A docs/newsletters)" ]; then
          echo "- **Newsletter**: ✅ Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: $(ls docs/newsletters/newsletter-*.html | head -1 | xargs basename)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Newsletter**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
        fi

        # Check if unified dashboard was generated
        if [ -f "docs/dashboard.html" ]; then
          echo "- **Dashboard**: ✅ Generated (docs/dashboard.html)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Dashboard**: ❌ Missing" >> $GITHUB_STEP_SUMMARY
        fi

        # Check if AI archive was created
        if [ -d "ai_archive" ] && [ "$(ls -A ai_archive 2>/dev/null)" ]; then
          archive_size=$(du -sh ai_archive 2>/dev/null | cut -f1)
          echo "- **AI Archive**: ✅ Created ($archive_size)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **AI Archive**: ❌ Missing" >> $GITHUB_STEP_SUMMARY
        fi
        
        # X.com threads: count TODAY's file only (the old xargs|head pipeline
        # read the oldest file and flooded the log with "Broken pipe")
        THREADS_FILE="docs/threads/threads-$(date -u +%F).json"
        if [ -f "$THREADS_FILE" ]; then
          thread_count=$(grep -c '"thread_title"' "$THREADS_FILE" || true)
          echo "- **X.com Threads**: ✅ Generated ($thread_count threads)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **X.com Threads**: ❌ Not generated today" >> $GITHUB_STEP_SUMMARY
        fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-newsletter
    # Deploy whenever the Pages artifact was uploaded — even if the email
    # delivery check failed the job afterwards.
    if: ${{ !cancelled() && needs.generate-newsletter.outputs.pages_ready == 'true' }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
