name: Weekly Digest

on:
  schedule:
    # Sundays at 8:00 UTC — after the Sunday daily issue exists
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the digest without sending'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create necessary directories
      run: mkdir -p logs output

    - name: Send weekly digest
      env:
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        BUTTONDOWN_USERNAME: ${{ secrets.BUTTONDOWN_USERNAME }}
        NEWSLETTER_TITLE: ${{ secrets.NEWSLETTER_TITLE || 'Geopolitical Daily' }}
      run: python -m src.weekly_digest

    - name: Upload digest preview
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: weekly-digest-preview
        path: output/weekly_digest_*.html
        retention-days: 14
        if-no-files-found: ignore
